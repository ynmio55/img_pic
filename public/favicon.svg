<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="smGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="#0B0F19"/>

  <path d="M 140 180 C 140 120, 240 110, 320 150 C 400 190, 380 290, 280 300 C 180 310, 150 400, 240 410 C 330 420, 380 370, 380 340" 
        stroke="url(#smGradient)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <circle cx="130" cy="180" r="16" fill="#00F2FE" />
  <circle cx="380" cy="150" r="12" fill="#4FACFE" />
  <circle cx="160" cy="330" r="14" fill="#00F2FE" />
  <circle cx="380" cy="340" r="18" fill="#7000FF" />
  <circle cx="280" cy="220" r="10" fill="#FFFFFF" />
  <circle cx="220" cy="270" r="8" fill="#00F2FE" />
  <circle cx="340" cy="260" r="9" fill="#7000FF" />
